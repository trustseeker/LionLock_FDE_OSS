name: publish

# Releases reach PyPI through Trusted Publishing: GitHub mints a short-lived OIDC token for this
# workflow and PyPI exchanges it for upload rights on this project alone. No API token is stored
# in the repository, in a secret or on a maintainer's machine.
on:
  release:
    types: [published]

# Nothing here writes to the repository. The one extra right needed, id-token, is granted to the
# publish job only, so the build cannot mint a token.
permissions:
  contents: read

jobs:
  # Build first, in an unprotected job, so the artifact a reviewer approves is the artifact that
  # gets uploaded. Building after approval would mean approving something that does not exist yet.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      # The sdist and wheel take their version from pyproject.toml, not from the tag. If the two
      # disagree, publishing would put something other than the announced release on PyPI, under a
      # version number nobody reviewed. Tags follow v<version>, as v1.0.0b1 did.
      - name: Check the release tag matches the declared version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          declared="$(python -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])')"
          echo "release tag: $TAG"
          echo "pyproject version: $declared"
          if [ "$TAG" != "v$declared" ]; then
            echo "::error::tag $TAG does not match pyproject version $declared (expected v$declared)"
            exit 1
          fi

      # Reproducible build. scripts/reproducible_build.py builds the commit with SOURCE_DATE_EPOCH
      # set to the commit time, a fixed umask and a normalised sdist, and the build backend is
      # pinned exactly in pyproject.toml. A maintainer who checks out the same commit and runs the
      # script gets files with the same sha256 as these (see the script for the one limit).
      - name: Build the sdist and wheel
        run: |
          python -m pip install --quiet build==1.6.1
          python scripts/reproducible_build.py dist

      - name: Record the sha256 of each distribution file
        run: |
          {
            echo "### sha256 of the built distributions (build job)"
            echo
            echo '```'
            (cd dist && sha256sum -- *)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Install and exercise the exact files that will be uploaded, in a fresh environment outside the
  # checkout, before anything can reach PyPI. Read-only: no id-token, no secrets.
  test-dist:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The checkout supplies only .python-version and the smoke script; nothing is installed
      # from it.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Record the sha256 of each distribution file
        run: |
          {
            echo "### sha256 of the downloaded distributions (test job)"
            echo
            echo '```'
            (cd dist && sha256sum -- *)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check there is one wheel and one sdist, both at the tag's version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import sys

          expected = os.environ["TAG"].removeprefix("v")
          files = sorted(p.name for p in pathlib.Path("dist").iterdir())
          wheels = [f for f in files if f.endswith(".whl")]
          sdists = [f for f in files if f.endswith(".tar.gz")]
          print("files:", files)
          problems = []
          if len(files) != 2 or len(wheels) != 1 or len(sdists) != 1:
              problems.append("expected exactly one wheel and one sdist and nothing else")
          if wheels and wheels[0].split("-")[1] != expected:
              problems.append(f"wheel version is not {expected}: {wheels[0]}")
          if sdists and sdists[0] != f"lionlock-{expected}.tar.gz":
              problems.append(f"sdist is not lionlock-{expected}.tar.gz: {sdists[0]}")
          for problem in problems:
              print("::error::" + problem)
          sys.exit(1 if problems else 0)
          PY

      - name: Create a fresh environment outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet twine==7.0.0

      - name: twine check --strict
        run: '"$RUNNER_TEMP/venv/bin/python" -m twine check --strict dist/*'

      - name: Install the wheel
        run: '"$RUNNER_TEMP/venv/bin/python" -m pip install dist/*.whl'

      - name: pip check
        run: '"$RUNNER_TEMP/venv/bin/python" -m pip check'

      # Run from a scratch directory so the working directory cannot supply the package.
      - name: Smoke test the installed wheel
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          smoke="$PWD/scripts/release_smoke.py"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" "$smoke" "${TAG#v}"
          "$RUNNER_TEMP/venv/bin/lionlock-telemetry" --help
          "$RUNNER_TEMP/venv/bin/lionlock-sim" --help
          "$RUNNER_TEMP/venv/bin/python" -m lionlock.sample_data
          "$RUNNER_TEMP/venv/bin/python" -c 'import importlib.metadata as m; print("lionlock", m.version("lionlock"))'

      # The sdist is uploaded too, and pip builds from it wherever the wheel is not used (for
      # example with --no-binary). Install it on its own, in a second fresh environment outside the
      # checkout, and run the same smoke steps, so a broken sdist cannot reach PyPI either.
      - name: Create a second fresh environment for the sdist
        run: python -m venv "$RUNNER_TEMP/venv-sdist"

      - name: Install the sdist
        run: '"$RUNNER_TEMP/venv-sdist/bin/python" -m pip install dist/*.tar.gz'

      - name: pip check (sdist)
        run: '"$RUNNER_TEMP/venv-sdist/bin/python" -m pip check'

      - name: Smoke test the installed sdist
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          smoke="$PWD/scripts/release_smoke.py"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv-sdist/bin/python" "$smoke" "${TAG#v}"
          "$RUNNER_TEMP/venv-sdist/bin/lionlock-telemetry" --help
          "$RUNNER_TEMP/venv-sdist/bin/lionlock-sim" --help
          "$RUNNER_TEMP/venv-sdist/bin/python" -m lionlock.sample_data
          "$RUNNER_TEMP/venv-sdist/bin/python" -c 'import importlib.metadata as m; print("lionlock", m.version("lionlock"))'

  publish:
    needs: [build, test-dist]
    runs-on: ubuntu-latest
    # The gate. This environment carries a required reviewer, so the run pauses here until a
    # maintainer approves it: nothing reaches PyPI unattended, even if a release is published by
    # accident.
    environment: pypi
    permissions:
      # Trusted Publishing needs to mint an OIDC token, and needs nothing else.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        # pypa/gh-action-pypi-publish v1.14.3, pinned by commit rather than tag: this is the one
        # step that runs with upload rights, and a tag can be moved to point at other code.
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          # PEP 740 attestations. This action version supports the input (default true); it is
          # stated here so that the behaviour is visible and not left to a default.
          attestations: true
