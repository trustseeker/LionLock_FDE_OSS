[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "lionlock"
version = "1.0.0b2"
description = "Deterministic, non-AI scoring and gating of LLM replies, with a hash-chained local audit log."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "LionLock Maintainers" }]
dependencies = []
keywords = ["llm", "guardrails", "deterministic", "audit-log", "gating", "ai-safety"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/trustseeker/LionLock_FDE_OSS"
Source = "https://github.com/trustseeker/LionLock_FDE_OSS"
Changelog = "https://github.com/trustseeker/LionLock_FDE_OSS/blob/main/CHANGELOG.md"
Issues = "https://github.com/trustseeker/LionLock_FDE_OSS/issues"
Security = "https://github.com/trustseeker/LionLock_FDE_OSS/blob/main/SECURITY.md"

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
  "ruff>=0.17.6",
  "mypy>=1.8.0",
  "pre-commit>=3.6.0",

  "pip-audit>=2.7.0",
]
gui = [
  "streamlit>=1.56.0",
]
failsafe = [
  "cryptography>=50.0.2",
]
# The SQL sinks and readers use SQLAlchemy for any URI except sqlite:///..., which needs no extra.
sql = [
  "sqlalchemy>=2.1.0",
]
# PostgreSQL. SQLAlchemy 2.1 is the first release that sends a postgresql:// URI to psycopg (3),
# which the token allowlist also uses; psycopg2 is only a fallback when SQLAlchemy is absent.
postgres = [
  "sqlalchemy>=2.1.0",
  "psycopg[binary]>=3.2.10",
]

[project.scripts]
lionlock-sim = "lionlock.sim.cli:main"
lionlock-telemetry = "lionlock.telemetry.cli:main"
[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
lionlock = ["py.typed", "sample_sessions.json"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
exclude = ["archive", ".venv", "venv", "build", "dist"]
line-length = 100
# Stays py310 although Python 3.11 is the minimum: at py311 ruff sorts tomllib with the standard
# library, which would re-sort imports in the protected harness.
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
